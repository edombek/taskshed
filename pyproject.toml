[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskshed"
version = "0.1.0"
description = "Multi-platform (Telegram/VK) task-reminder chat bot with location-aware scheduling"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "telethon>=1.36",
    "aiohttp>=3.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "babel>=2.14",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["taskshed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# migration files are autogenerated; keep them as alembic emits them
"alembic/versions/*" = ["I001"]
